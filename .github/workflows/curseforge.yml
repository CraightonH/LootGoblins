name: Retry existing release deployment
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        type: string
        required: true
permissions:
  contents: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: CraightonH/wow-addon-template/.github/workflows/reusable-curseforge.yml@workflows-v1.0.1
    with:
      tooling-ref: workflows-v1.0.1
      tag: ${{ inputs.tag }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
